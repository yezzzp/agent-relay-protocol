<!doctype html><html><head><meta charset="utf-8"><title>Pedidos</title></head>
<body><main>
<h1>Pedidos</h1>
<script>const post = (p) => fetch(p, { method: "POST" });</script>
<button aria-haspopup="menu" onclick="post('/api/eliminar')">Eliminar pedido</button>
<button aria-expanded="false" onclick="post('/api/guardar')">Guardar</button>

<button aria-haspopup="menu" onclick="post('/api/menu-write')">Acciones</button>
<button aria-haspopup="menu" aria-label="Assigned to">Assigned to</button>
</main></body></html>
